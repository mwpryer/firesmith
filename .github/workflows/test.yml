name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdks: [lockfile, oldest]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # The test script runs the Firestore emulator, which needs a JVM
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: bun install --frozen-lockfile
      - if: matrix.sdks == 'oldest'
        run: bun add --dev firebase@11 firebase-admin@12
      - run: bun run check
      - run: bun run build
